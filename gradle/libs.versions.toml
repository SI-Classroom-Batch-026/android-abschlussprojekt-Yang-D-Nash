[versions]
# ------------------------
# Android / Kotlin
# ------------------------
agp = "8.13.1"                       # Android Gradle Plugin
#noinspection NewerVersionAvailable
kotlin = "2.1.0"                     # Kotlin Plugin
kspVersion = "2.1.0-1.0.29"          # Kotlin Symbol Processing (Room Compiler etc.)

# ------------------------
# Compose / UI
# ------------------------
composeBom = "2025.11.01"             # Compose BOM
activityCompose = "1.12.0"            # Compose Activity
navigationCompose = "2.9.6"           # Compose Navigation

# ------------------------
# Lifecycle / Core
# ------------------------
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.10.0"

# ------------------------
# Testing
# ------------------------
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# ------------------------
# Networking / Serialization
# ------------------------
moshiVersion = "1.15.2"
retrofitVersion = "3.0.0"
loggingInterceptor = "5.3.2"
okhttp = "5.3.2"
kotlinSerialization = "1.9.0"
gson = "2.13.2"

# ------------------------
# Image Loading
# ------------------------
coilCompose = "3.3.0"

# ------------------------
# Dependency Injection
# ------------------------
koinBom = "4.1.1"

# ------------------------
# Location / Maps
# ------------------------
playServicesLocation = "21.3.0"
playServicesMaps = "19.2.0"
mapsCompose = "6.12.2"

# ------------------------
# Room / DataStore / WorkManager
# ------------------------
roomRuntime = "2.8.4"
datastorePreferences = "1.2.0"
workRuntimeKtx = "2.11.0"

# ------------------------
# Firebase
# ------------------------
firebase-bom = "34.6.0"

# ------------------------
# CameraX
# ------------------------
camerax = "1.5.1"

# ------------------------
# ML Kit
# ------------------------
mlkit-text = "16.0.1"
mlkit-translate = "17.0.3"
# ------------------------
# ARCore / Brillen-ready
# ------------------------
arCore = "1.51.0"

[libraries]
# ------------------------
# Core
# ------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# ------------------------
# Lifecycle / Compose
# ------------------------
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ------------------------
# Testing
# ------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# ------------------------
# Location & Maps
# ------------------------
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
google-maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }

# ------------------------
# Dependency Injection
# ------------------------
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

# ------------------------
# Networking / Serialization
# ------------------------
moshi = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiVersion" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofitVersion" }
converterMoshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofitVersion" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }

# ------------------------
# Images / Coil
# ------------------------
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coilCompose" }

# ------------------------
# Room / DataStore / WorkManager
# ------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomRuntime" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomRuntime" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }

# ------------------------
# Firebase
# ------------------------
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

# ------------------------
# CameraX
# ------------------------
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# ------------------------
# ML Kit
# ------------------------
mlkit-text = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }

# ------------------------
# ARCore / Brillen-ready
# ------------------------

arcore = { group = "com.google.ar", name = "core", version.ref = "arCore" }

androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
